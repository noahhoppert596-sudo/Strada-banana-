<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500&display=swap">
<title>HILLTOP SAMUI – Villa mit Infinity-Pool über Chaweng</title>
<style>

:root{
  --bg:#0a0c0f; --bg2:#111419; --line:rgba(255,255,255,.1); --txt:#f2efe9; --mut:#9a9890;
  --acc:#e0a06a; --acc2:#f3c99c; --glass:rgba(18,21,26,.62);
  --sans:'Inter',system-ui,-apple-system,sans-serif; --serif:'Instrument Serif',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
em,.it{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--acc2)}
.wrap{width:min(1240px,92vw);margin:0 auto}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;font-size:14px;font-weight:500;transition:transform .3s,background .3s,box-shadow .3s}
.pill.acc{background:var(--acc);color:#1a1209}
.pill.acc:hover{transform:translateY(-2px);box-shadow:0 10px 30px -8px var(--acc)}
.pill.ghost{border:1px solid rgba(255,255,255,.25)}
.pill.ghost:hover{background:rgba(255,255,255,.08)}

/* Loader */
#loader{position:fixed;inset:0;z-index:100;background:#08090b;display:flex;flex-direction:column;justify-content:flex-end;padding:6vw;transition:clip-path 1.1s cubic-bezier(.77,0,.18,1);clip-path:inset(0 0 0 0)}
#loader.done{clip-path:inset(0 0 100% 0)}
#loader .num{font-size:clamp(90px,20vw,260px);font-weight:500;letter-spacing:-.05em;line-height:.8}
#loader .num sup{font-size:.25em;vertical-align:top;color:var(--acc)}
#loader .bar{height:2px;background:var(--line);margin-top:28px;position:relative;overflow:hidden}
#loader .bar i{position:absolute;inset:0;background:var(--acc);transform-origin:left;transform:scaleX(0)}
#loader .row{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--mut)}
#loader .bricks{position:absolute;top:6vw;right:6vw;display:grid;grid-template-columns:repeat(6,22px);gap:4px}
#loader .bricks span{height:11px;background:#b5654a;border-radius:1px;opacity:0;transform:translateY(-14px);transition:.35s}
#loader .bricks span.on{opacity:1;transform:none}

/* Nav */
nav.top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 4vw;transition:background .4s,padding .4s,backdrop-filter .4s}
nav.top.solid{background:rgba(10,12,15,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 4vw;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.32em;font-size:13px}
.logo svg{width:26px;height:26px}
nav.top .links{display:flex;gap:30px;font-size:13px;color:#cfccc4}
nav.top .links a{position:relative}
nav.top .links a::after{content:"";position:absolute;left:0;bottom:-5px;width:100%;height:1px;background:var(--acc);transform:scaleX(0);transform-origin:right;transition:transform .4s}
nav.top .links a:hover::after{transform:scaleX(1);transform-origin:left}
nav.top .right{display:flex;gap:10px;align-items:center}
.cartbtn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;transition:.3s}
.cartbtn:hover{background:rgba(255,255,255,.08)}
.cartbtn b{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:99px;background:var(--acc);color:#1a1209;font-size:11px;display:grid;place-items:center;padding:0 5px;transform:scale(0);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.cartbtn b.on{transform:scale(1)}
.cartbtn.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.burger{display:none}
@media(max-width:900px){nav.top .links{display:none}.burger{display:grid;width:42px;height:42px;place-items:center}nav.top .pill.acc{display:none}}
#mmenu{position:fixed;inset:0;z-index:49;background:#0a0c0f;display:flex;flex-direction:column;justify-content:center;padding:8vw;gap:6px;clip-path:circle(0% at 95% 4%);transition:clip-path .7s cubic-bezier(.77,0,.18,1)}
#mmenu.open{clip-path:circle(150% at 95% 4%)}
#mmenu a{font-size:42px;letter-spacing:-.02em;padding:4px 0;border-bottom:1px solid var(--line)}

/* Build hero */
#build{height:760vh;position:relative}
#build .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.55)),linear-gradient(90deg,rgba(0,0,0,.45),transparent 45%)}
.caps{position:absolute;left:5vw;top:50%;transform:translateY(-50%);width:min(560px,88vw);pointer-events:none}
.cap{position:absolute;left:0;top:0;transform:translateY(-50%)}
.cap h1,.cap h2{font-size:clamp(40px,6.2vw,92px);font-weight:500;letter-spacing:-.035em;line-height:.95}
.cap h1 em,.cap h2 em{display:block;font-size:1.08em;letter-spacing:-.01em}
.cap p{margin-top:20px;color:#d5d1c8;max-width:390px;line-height:1.6;font-size:15px}
.cap .ctas{margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;pointer-events:auto}
.cap .line{display:block;overflow:hidden}
.cap .line>span{display:block;transform:translateY(105%);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.cap p,.cap .ctas{opacity:0;transform:translateY(16px);transition:.8s .25s}
.cap.on .line>span{transform:none}
.cap.on .line:nth-child(2)>span{transition-delay:.08s}
.cap.on p,.cap.on .ctas{opacity:1;transform:none}
.hud{position:absolute;left:5vw;right:5vw;bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:92px}
.chip small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.chip span{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.plan{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px;width:150px}
.plan svg{width:100%;height:auto;display:block}
.plan svg .p{fill:none;stroke:var(--acc);stroke-width:1.4}
.plan small{display:block;font-size:10px;letter-spacing:.2em;color:var(--mut);margin-top:6px;text-transform:uppercase}
.progress{position:absolute;right:2.2vw;top:50%;transform:translateY(-50%);height:38vh;width:2px;background:var(--line)}
.progress i{position:absolute;left:0;top:0;width:100%;background:var(--acc);height:0}
.progress span{position:absolute;left:-4px;width:10px;height:10px;border-radius:50%;border:1px solid var(--mut);background:var(--bg);transition:.3s}
.progress span.on{background:var(--acc);border-color:var(--acc)}
.scrollhint{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;color:#cfccc4;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .5s}
.scrollhint i{width:22px;height:36px;border:1px solid rgba(255,255,255,.4);border-radius:12px;position:relative}
.scrollhint i::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;border-radius:2px;background:#fff;transform:translateX(-50%);animation:wheel 1.6s infinite}
@keyframes wheel{to{transform:translate(-50%,12px);opacity:0}}
@media(max-width:700px){.plan{display:none}.caps{top:22%;transform:none}.cap{transform:none}.chip{min-width:0;padding:8px 10px}.chip span{font-size:15px}.progress{display:none}.vign{background:linear-gradient(180deg,rgba(0,0,0,.6),transparent 45%,rgba(0,0,0,.5))}}

/* Generic sections */
section{position:relative}
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s,transform 1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.h2{font-size:clamp(36px,5.2vw,78px);font-weight:500;letter-spacing:-.035em;line-height:1}
.lead{color:#c9c5bc;line-height:1.7;font-size:16px;max-width:520px}

/* Reveal photo */
#chapter{height:260vh}
#chapter .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:grid;place-items:center}
#chapter .ph{position:absolute;inset:0;clip-path:inset(18% 22% 18% 22% round 24px);will-change:clip-path}
#chapter .ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.25);will-change:transform}
#chapter .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.6),transparent 60%)}
#chapter .txt{position:absolute;left:6vw;bottom:14vh;z-index:2;max-width:560px}
#chapter .txt .h2{margin:14px 0 18px}

/* Horizontal gallery */
#light{height:340vh}
#light .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
#light .head{padding:0 6vw;display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:5vh}
#light .track{display:flex;gap:2.4vw;padding-left:6vw;will-change:transform}
#light figure{flex:0 0 auto;width:min(62vw,880px);height:min(58vh,560px);border-radius:22px;overflow:hidden;position:relative}
#light figure img{width:120%;height:100%;object-fit:cover;will-change:transform}
#light figcaption{position:absolute;left:22px;bottom:20px;right:22px;display:flex;justify-content:space-between;align-items:flex-end;font-size:14px}
#light figcaption b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px}
#light figcaption span{background:var(--glass);backdrop-filter:blur(8px);padding:7px 12px;border-radius:99px;font-size:12px}
@media(max-width:700px){#light figure{width:82vw;height:50vh}#light .head{flex-direction:column;align-items:flex-start;gap:12px}#light .head .lead{font-size:14px}}

/* Promise split */
#promise{padding:16vh 0}
#promise .grid{display:grid;grid-template-columns:1fr 1.25fr;gap:6vw;align-items:center}
#promise .img{border-radius:24px;overflow:hidden;aspect-ratio:4/3.2;position:relative}
#promise .img img{width:100%;height:100%;object-fit:cover;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12) translate(-2%,-2%)}}
#promise .badge{position:absolute;left:20px;top:20px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px}
#promise .badge b{display:block;font-size:26px;font-weight:500}
#promise ul{list-style:none;margin-top:34px;border-top:1px solid var(--line)}
#promise li{display:flex;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}
#promise li i{font-style:normal;color:var(--acc);font-size:12px;letter-spacing:.2em;min-width:28px}
#promise li strong{font-weight:500;display:block;margin-bottom:4px}
#promise li span{color:var(--mut);font-size:14px;line-height:1.6}
@media(max-width:900px){#promise .grid{grid-template-columns:1fr}}

/* 3D carousel */
#ways{height:380vh}
#ways .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:1600px}
#ways .head{text-align:center;margin-bottom:5vh;position:relative;z-index:3}
#ways .ring{position:relative;width:min(330px,62vw);height:min(440px,52vh);transform-style:preserve-3d;will-change:transform}
.card{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:#15181d;border:1px solid var(--line);backface-visibility:hidden;transform-style:preserve-3d;box-shadow:0 40px 80px -30px #000}
.card img{width:100%;height:62%;object-fit:cover}
.card .c{padding:18px 18px 20px}
.card .n{font-size:11px;letter-spacing:.24em;color:var(--acc)}
.card h3{font-weight:500;font-size:22px;margin:8px 0 6px;letter-spacing:-.02em}
.card p{font-size:13px;color:var(--mut);line-height:1.55}
.card .from{position:absolute;top:14px;right:14px;background:var(--glass);backdrop-filter:blur(8px);padding:6px 11px;border-radius:99px;font-size:12px}
#ways .dots{display:flex;gap:8px;margin-top:5vh;z-index:3}
#ways .dots span{width:28px;height:3px;border-radius:2px;background:var(--line);transition:.4s}
#ways .dots span.on{background:var(--acc);width:46px}

/* Stats */
#stats{min-height:110vh;display:flex;align-items:flex-end;overflow:hidden}
#stats .bg{position:absolute;inset:-10% 0;background:url(img/team.webp) center/cover;filter:grayscale(.5) brightness(.42);will-change:transform}
#stats .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 4%,transparent 60%)}
#stats .wrap{position:relative;padding:20vh 0 12vh}
#stats .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:8vh;border-top:1px solid var(--line);padding-top:30px}
#stats .nums div b{font-size:clamp(46px,6vw,92px);font-weight:500;letter-spacing:-.04em;font-variant-numeric:tabular-nums;display:block;line-height:1}
#stats .nums div span{color:var(--mut);font-size:14px}
@media(max-width:700px){#stats .nums{grid-template-columns:1fr 1fr;row-gap:36px}}

/* Process */
#process{padding:16vh 0}
#process .steps{margin-top:8vh;display:grid;grid-template-columns:repeat(5,1fr);gap:22px;position:relative}
#process .track{position:absolute;left:0;right:0;top:14px;height:1px;background:var(--line)}
#process .track i{position:absolute;inset:0;background:var(--acc);transform-origin:left;transform:scaleX(0);transition:transform 2.2s cubic-bezier(.2,.8,.2,1)}
#process .steps.in .track i{transform:scaleX(1)}
.step{position:relative;padding-top:48px}
.step::before{content:"";position:absolute;top:8px;left:0;width:13px;height:13px;border-radius:50%;background:var(--bg);border:1px solid var(--acc)}
.step b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:24px;display:block;margin-bottom:8px}
.step small{color:var(--acc);font-size:11px;letter-spacing:.2em}
.step p{color:var(--mut);font-size:14px;line-height:1.6;margin-top:8px}
@media(max-width:900px){#process .steps{grid-template-columns:1fr;gap:6px}#process .track{left:6px;right:auto;top:0;bottom:0;width:1px;height:auto}#process .track i{transform-origin:top;transform:scaleY(0)}#process .steps.in .track i{transform:scaleY(1)}.step{padding:0 0 26px 34px}.step::before{top:6px;left:0}}

/* Shop */
#shop{padding:14vh 0}
#shop .top{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap}
.houses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:7vh 0 4vh}
.house{border:1px solid var(--line);border-radius:20px;padding:26px;background:linear-gradient(180deg,#14171c,#0e1013);position:relative;overflow:hidden;transition:transform .5s,border-color .5s}
.house:hover{transform:translateY(-6px);border-color:rgba(224,160,106,.5)}
.house.hl{border-color:rgba(224,160,106,.6)}
.house.hl::before{content:"Beliebt";position:absolute;top:18px;right:18px;font-size:11px;background:var(--acc);color:#1a1209;padding:4px 10px;border-radius:99px}
.house h3{font-weight:500;font-size:22px}
.house .pr{font-size:40px;font-weight:500;letter-spacing:-.03em;margin:16px 0 4px}
.house .pr small{font-size:14px;color:var(--mut);font-weight:400}
.house ul{list-style:none;margin:18px 0 0;font-size:14px;color:#c9c5bc}
.house li{padding:9px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.house li::before{content:"✓";color:var(--acc)}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.item{border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;background:#0f1215;transition:border-color .4s}
.item:hover{border-color:rgba(255,255,255,.25)}
.item .ic{width:42px;height:42px;border-radius:12px;background:rgba(224,160,106,.12);display:grid;place-items:center;color:var(--acc)}
.item h4{font-weight:500;font-size:17px}
.item p{color:var(--mut);font-size:13.5px;line-height:1.55;flex:1}
.item .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.item .row b{font-size:20px;font-weight:500}
.add{padding:10px 16px;border-radius:99px;background:#fff;color:#111;font-size:13px;font-weight:500;transition:.3s}
.add:hover{background:var(--acc)}
.add.ok{background:#5fbf7a;color:#fff}
@media(max-width:900px){.houses,.items{grid-template-columns:1fr}}

/* Reviews */
#reviews{padding:12vh 0}
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6vh}
.rev{border:1px solid var(--line);border-radius:18px;padding:26px;background:#0f1215}
.rev .st{color:var(--acc);letter-spacing:3px}
.rev q{display:block;font-family:var(--serif);font-size:23px;line-height:1.3;margin:14px 0 20px;quotes:none}
.rev small{color:var(--mut)}
@media(max-width:900px){.revs{grid-template-columns:1fr}}

/* FAQ */
#faq{padding:12vh 0}
#faq .grid{display:grid;grid-template-columns:1fr 1.4fr;gap:6vw}
.qa{border-bottom:1px solid var(--line)}
.qa button{width:100%;text-align:left;padding:22px 0;display:flex;justify-content:space-between;gap:20px;font-size:17px;font-weight:500}
.qa button i{font-style:normal;transition:transform .4s;color:var(--acc);font-size:22px;line-height:1}
.qa.open button i{transform:rotate(45deg)}
.qa .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s}
.qa.open .a{grid-template-rows:1fr}
.qa .a>div{overflow:hidden;color:var(--mut);line-height:1.7;font-size:15px}
.qa .a>div p{padding-bottom:22px}
@media(max-width:900px){#faq .grid{grid-template-columns:1fr}}

/* Contact */
#contact{padding:12vh 0}
#contact .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6vh}
.box{border:1px solid var(--line);border-radius:20px;padding:28px;background:#0f1215}
.map{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:#13171c;margin-bottom:22px}
.map svg{width:100%;height:100%}
.pin{position:absolute;left:56%;top:46%;transform:translate(-50%,-100%)}
.pin::before{content:"";position:absolute;left:50%;bottom:-6px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--acc);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,160,106,.7)}100%{box-shadow:0 0 0 26px rgba(224,160,106,0)}}
.pin span{display:block;background:#fff;color:#111;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;margin-bottom:12px}
.hours{width:100%;border-collapse:collapse;font-size:14px;margin-top:14px}
.hours td{padding:9px 0;border-top:1px solid var(--line)}
.hours td:last-child{text-align:right;color:#c9c5bc}
.hours tr.today td{color:var(--acc)}
form .f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inp{width:100%;background:#0a0c0f;border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--txt);font:inherit;font-size:14px;outline:none;transition:border-color .3s}
.inp:focus{border-color:var(--acc)}
textarea.inp{min-height:120px;resize:vertical}
label.l{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
@media(max-width:900px){#contact .grid{grid-template-columns:1fr}form .f{grid-template-columns:1fr}}

/* Final */
#final{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#final .bg{position:absolute;inset:0;background:url(img/abend.webp) center/cover;filter:brightness(.45)}
#final .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 2%,transparent 55%)}
#final .wrap{position:relative;padding-bottom:4vh}
#final .big{font-size:clamp(60px,15.5vw,250px);font-weight:600;letter-spacing:-.05em;line-height:.8;display:flex;overflow:hidden;margin-top:6vh;background:linear-gradient(180deg,#f3f0ea,#a9b4c9);-webkit-background-clip:text;background-clip:text;color:transparent}
#final .big span{display:inline-block;transform:translateY(100%);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
#final .big.in span{transform:none}
footer{border-top:1px solid var(--line);padding:40px 0 60px;font-size:13px;color:var(--mut)}
footer .grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px}
footer h5{color:var(--txt);font-weight:500;font-size:13px;margin-bottom:12px}
footer a{display:block;padding:4px 0}

/* Cart drawer */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:60;opacity:0;pointer-events:none;transition:.4s}
#overlay.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#0f1215;border-left:1px solid var(--line);z-index:61;transform:translateX(105%);transition:transform .6s cubic-bezier(.77,0,.18,1);display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawer header{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line)}
#drawer header h3{font-weight:500}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:18px}
#lines{flex:1;overflow:auto;padding:10px 24px}
.ln{display:grid;grid-template-columns:1fr auto;gap:8px;padding:16px 0;border-bottom:1px solid var(--line);animation:slin .45s}
@keyframes slin{from{opacity:0;transform:translateX(20px)}}
.ln h5{font-weight:500;font-size:15px}
.ln .q{display:flex;align-items:center;gap:6px;margin-top:10px}
.ln .q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line)}
.ln .q span{min-width:22px;text-align:center}
.ln .rm{font-size:12px;color:var(--mut);margin-left:10px;text-decoration:underline}
.ln b{font-weight:500}
.empty{color:var(--mut);text-align:center;padding:60px 0;line-height:1.7}
#drawer footer{border-top:1px solid var(--line);padding:20px 24px;color:var(--txt)}
.sum{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);padding:4px 0}
.sum.t{color:var(--txt);font-size:20px;font-weight:500;margin:8px 0 16px}
.wide{width:100%;justify-content:center}
.pill[disabled]{opacity:.4;pointer-events:none}

/* Checkout modal */
#co{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:4vw;pointer-events:none}
#co .panel{width:min(680px,100%);max-height:92vh;overflow:auto;background:#111419;border:1px solid var(--line);border-radius:24px;padding:30px;transform:translateY(30px) scale(.97);opacity:0;transition:.5s cubic-bezier(.2,.8,.2,1)}
#co.on{pointer-events:auto}
#co.on .panel{transform:none;opacity:1}
.stepper{display:flex;gap:8px;margin:16px 0 22px}
.stepper span{flex:1;height:3px;border-radius:2px;background:var(--line);transition:.4s}
.stepper span.on{background:var(--acc)}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.pay label{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center;transition:.3s}
.pay input{accent-color:var(--acc)}
.pay label:has(input:checked){border-color:var(--acc);background:rgba(224,160,106,.08)}
.cardf{display:none;margin-top:10px}
.cardf.on{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.done{text-align:center;padding:20px 0}
.done svg{width:90px;height:90px;margin:0 auto 18px}
.done svg circle{stroke-dasharray:283;stroke-dashoffset:283;animation:dr 1s forwards}
.done svg path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .6s .8s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.err{color:#ff8a7a;font-size:13px;margin-top:10px;min-height:18px}
@media(max-width:600px){.pay{grid-template-columns:1fr}.cardf.on{grid-template-columns:1fr 1fr}}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,140%);background:#fff;color:#111;padding:12px 20px;border-radius:99px;font-size:14px;font-weight:500;z-index:90;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
#toast.on{transform:translate(-50%,0)}
.cursor{position:fixed;left:0;top:0;width:34px;height:34px;border:1px solid rgba(255,255,255,.5);border-radius:50%;pointer-events:none;z-index:95;transform:translate(-50%,-50%);transition:width .3s,height .3s,background .3s;mix-blend-mode:difference}
.cursor.big{width:70px;height:70px;background:rgba(255,255,255,.9)}
@media(hover:none){.cursor{display:none}}

/* ===== Villa overrides ===== */
:root{--acc:#f2a27a;--acc2:#ffd2b8;--aqua:#46d8e4;--bg:#080b0e}
#loader .wave{position:absolute;top:6vw;right:6vw;width:160px;height:60px}
#loader .wave path{fill:none;stroke:var(--aqua);stroke-width:2;stroke-dasharray:260;stroke-dashoffset:260;animation:dr 1.8s ease forwards}
#hero{height:620vh;position:relative}
#hero .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#000}
#hero .layer{position:absolute;inset:0;will-change:transform,opacity,filter}
#hero .layer img{width:100%;height:100%;object-fit:cover}
#hero .warm{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,120,60,.0),rgba(255,140,70,.35) 45%,rgba(120,40,80,.35));mix-blend-mode:soft-light;opacity:0;pointer-events:none}
#hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.05) 55%),linear-gradient(0deg,rgba(0,0,0,.55),transparent 30%);pointer-events:none}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sunbox{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:170px}
.sunbox svg{width:100%;display:block}
.sunbox small{display:block;font-size:10px;letter-spacing:.2em;color:var(--mut);margin-top:4px;text-transform:uppercase}
.badge-demo{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;font-size:11px;letter-spacing:.06em;background:rgba(8,11,14,.75);backdrop-filter:blur(8px);border:1px solid var(--line);padding:6px 12px;border-radius:99px;color:#cfccc4;white-space:nowrap}
@media(max-width:700px){.sunbox{display:none}#hero .hud{bottom:52px}}
/* facts */
#facts{padding:16vh 0}
#facts .grid{display:grid;grid-template-columns:1fr 1.2fr;gap:6vw;align-items:center}
#facts .img{border-radius:24px;overflow:hidden;aspect-ratio:4/3.3;position:relative}
#facts .img img{width:100%;height:100%;object-fit:cover;animation:kb 18s ease-in-out infinite alternate}
.factnums{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:34px}
.factnums div{border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;background:#0e1215}
.factnums b{display:block;font-size:34px;font-weight:500;letter-spacing:-.03em}
.factnums span{font-size:12px;color:var(--mut)}
@media(max-width:900px){#facts .grid{grid-template-columns:1fr}.factnums{grid-template-columns:repeat(2,1fr)}}
/* amenities */
#amen{padding:12vh 0}
.amen{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6vh}
.am{border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;gap:14px;align-items:center;background:#0e1215;transition:.4s}
.am:hover{border-color:rgba(70,216,228,.5);transform:translateY(-3px)}
.am i{width:40px;height:40px;border-radius:12px;background:rgba(70,216,228,.1);color:var(--aqua);display:grid;place-items:center;flex:0 0 auto;font-style:normal}
.am span{font-size:14px}
@media(max-width:900px){.amen{grid-template-columns:1fr 1fr}}
/* rating bars */
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 40px;margin-top:6vh}
.bar{font-size:14px}
.bar div{display:flex;justify-content:space-between;margin-bottom:8px}
.bar u{display:block;height:3px;background:var(--line);border-radius:2px;overflow:hidden;text-decoration:none}
.bar u i{display:block;height:100%;background:var(--acc);transform-origin:left;transform:scaleX(0);transition:transform 1.6s cubic-bezier(.2,.8,.2,1)}
.bars.in .bar u i{transform:scaleX(var(--v))}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:5vh}
.tags span{border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13px;color:#d6d2c9}
.tags span b{color:var(--acc);font-weight:500;margin-left:6px}
@media(max-width:900px){.bars{grid-template-columns:1fr}}
/* booking */
#book{padding:14vh 0}
#book .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:6vh;align-items:start}
.bk{border:1px solid rgba(242,162,122,.4);border-radius:22px;padding:28px;background:linear-gradient(180deg,#141a1f,#0d1114);position:sticky;top:90px}
.bk .pr{font-size:34px;font-weight:500;letter-spacing:-.02em}
.bk .pr small{font-size:14px;color:var(--mut);font-weight:400}
.bk .dates{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:18px}
.bk .dates label{padding:12px 14px;display:block}
.bk .dates label+label{border-left:1px solid var(--line)}
.bk .dates small,.bk .gu small{display:block;font-size:10px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase}
.bk input[type=date],.bk select{background:none;border:0;color:var(--txt);font:inherit;font-size:15px;width:100%;outline:none;color-scheme:dark;margin-top:4px}
.bk .gu{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.bk .gu select option{background:#111}
.extras{display:grid;gap:12px}
.ex{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;background:#0e1215;transition:border-color .4s}
.ex:hover{border-color:rgba(255,255,255,.25)}
.ex .ic{width:72px;height:72px;border-radius:12px;background:linear-gradient(135deg,rgba(70,216,228,.18),rgba(242,162,122,.18));display:grid;place-items:center;font-size:28px}
.ex h4{font-weight:500;font-size:16px}
.ex p{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.5}
.ex .r{text-align:right}
.ex .r b{display:block;font-weight:500;margin-bottom:8px}
@media(max-width:900px){#book .grid{grid-template-columns:1fr}.bk{position:static}.ex{grid-template-columns:52px 1fr;}.ex .ic{width:52px;height:52px;font-size:22px}.ex .r{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;text-align:left}.ex .r b{margin:0}}
/* location */
.island{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/11;background:radial-gradient(circle at 50% 50%,#0d2a36,#081720);margin-bottom:22px}
.island svg{width:100%;height:100%}
.island .wv{animation:wv 6s ease-in-out infinite alternate}
@keyframes wv{to{transform:translateY(4px)}}
.rules{list-style:none;font-size:14px}
.rules li{padding:11px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}
.rules li span:last-child{color:#c9c5bc;text-align:right}
#final .bg{background-image:url(img/pool-nacht.webp)}
#stats .bg{background-image:url(img/terrasse.webp)}

html[lang=zh] body{font-family:'Inter','Noto Sans SC',sans-serif}

#tour{position:relative}
#tour .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#000}
.shot{position:absolute;inset:0;opacity:0;will-change:transform,opacity,filter;transform-origin:50% 50%}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
#tour .shade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.66),rgba(0,0,0,.12) 58%,rgba(0,0,0,.05)),linear-gradient(0deg,rgba(0,0,0,.6),transparent 32%),linear-gradient(180deg,rgba(0,0,0,.5),transparent 20%)}

.tcap{position:absolute;left:5vw;top:50%;transform:translateY(-50%);width:min(600px,88vw);z-index:4}
.tcap .eb{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#e8e3da;display:flex;gap:12px;align-items:center;margin-bottom:18px;opacity:0;transition:.6s}
.tcap .eb b{color:var(--acc);font-weight:500}
.tcap .eb i{width:34px;height:1px;background:rgba(255,255,255,.5)}
.tcap h2{font-size:clamp(40px,6vw,92px);font-weight:500;letter-spacing:-.035em;line-height:.98}
.tcap h2 em{display:block;font-size:1.06em;letter-spacing:-.01em}
.tcap .line{display:block;overflow:hidden;padding-bottom:.06em}
.tcap .line>span{display:block;transform:translateY(110%);transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.tcap p{margin-top:20px;color:#e2ded6;max-width:420px;line-height:1.6;font-size:15.5px;opacity:0;transform:translateY(14px);transition:.8s .2s}
.tcap .ctas{margin-top:24px;display:none;gap:10px;flex-wrap:wrap}
.tcap.end .ctas{display:flex}
.tcap.on .eb{opacity:1}
.tcap.on .line>span{transform:none}
.tcap.on .line:nth-child(2)>span{transition-delay:.07s}
.tcap.on p{opacity:1;transform:none}
.rail{position:absolute;right:2vw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:4}
.rail button{display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:transparent;transition:color .4s}
.rail button i{width:14px;height:2px;background:rgba(255,255,255,.35);border-radius:2px;transition:.4s}
.rail button.on{color:#fff}
.rail button.on i{width:34px;background:var(--acc)}
.rail:hover button{color:rgba(255,255,255,.65)}
.rail button.done i{background:rgba(242,162,122,.6)}
.tplan{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px;width:190px}
.tplan svg{width:100%;display:block}

.tplan .z.on{fill:rgba(242,162,122,.25);stroke:var(--acc)}
.tplan text{font-size:5.4px;fill:#bdb8ae;font-family:Inter}
.tplan small{display:block;font-size:10px;letter-spacing:.2em;color:var(--mut);margin-top:6px;text-transform:uppercase}
#dot{transition:cx .7s cubic-bezier(.2,.8,.2,1),cy .7s cubic-bezier(.2,.8,.2,1)}
.tbar{position:absolute;left:0;top:0;height:3px;background:var(--acc);z-index:5;width:0}
.skip{position:absolute;right:5vw;top:86px;z-index:4;font-size:12px;letter-spacing:.08em;padding:9px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);backdrop-filter:blur(6px)}
.skip:hover{background:rgba(255,255,255,.12)}
@media(max-width:700px){.tplan,.rail{display:none}.tcap{top:auto;bottom:118px;transform:none}#tour .shade{background:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,.2) 55%,rgba(0,0,0,.35))}.tcap h2{font-size:40px}.tcap p{font-size:14.5px}#tour .hud{bottom:52px}.skip{top:74px}}

const LANGS=[['de','Deutsch'],['en','English'],['it','Italiano'],['zh','中文']];
const LOCALE={de:'de-DE',en:'en-GB',it:'it-IT',zh:'zh-CN'};
</script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,v)=>{const t=clamp((v-a)/(b-a));return t*t*(3-2*t)};
const $=s=>document.querySelector(s);
const isMobile=matchMedia('(max-width:700px)').matches;

/* ===== language ===== */
let lang='de';
try{const s=localStorage.getItem('hilltop-lang');if(s&&T[s])lang=s;else{const n=(navigator.language||'de').slice(0,2);if(T[n])lang=n}}catch(e){}
const t=k=>(T[lang][k]??T.de[k]);
LANGS.forEach(([c,n])=>{const li=document.createElement('li');li.innerHTML=`<button data-l="${c}">${n}<span>${c.toUpperCase()}</span></button>`;$('#langList').appendChild(li)});
$('#langBtn').onclick=e=>{e.stopPropagation();$('#lang').classList.toggle('open')};
document.addEventListener('click',()=>$('#lang').classList.remove('open'));
$('#langList').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;setLang(b.dataset.l);$('#lang').classList.remove('open')});

/* loader */
const lStart=performance.now();
(function lt(){const k=(performance.now()-lStart)/1900;const lp=Math.min(100,Math.round(ss(0,1,k)*100));
 $('#lnum').textContent=lp;$('#lbar').style.transform=`scaleX(${lp/100})`;$('#ltxt').textContent=T[lang].loader[Math.min(4,Math.floor(lp/20.1))];
 if(lp<100)requestAnimationFrame(lt);else setTimeout(()=>{$('#loader').classList.add('done');document.body.classList.remove('locked')},250)})();

/* smooth scroll */
let lenis=null;try{if(window.Lenis&&!matchMedia('(hover:none)').matches)lenis=new Lenis({lerp:.09})}catch(e){}
const goTo=(el,off=0)=>{if(lenis)lenis.scrollTo(el,{duration:1.5,offset:off});else{const y=(typeof el==='number'?el:el.getBoundingClientRect().top+scrollY)+off;scrollTo({top:y,behavior:'smooth'})}};
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{const id=a.getAttribute('href');if(id.length<2){e.preventDefault();return}const el=document.querySelector(id);if(!el)return;
 e.preventDefault();$('#mmenu').classList.remove('open');goTo(el)}));
$('#burger').onclick=()=>$('#mmenu').classList.toggle('open');
document.querySelectorAll('a.ph').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();toast(a.textContent+' – '+t('t.ph'))}));

/* ===== TOUR ===== */
// img, zone, clock, pan [x0,y0,x1,y1] in %, zoom direction
const STOPS=[
 ['aussen-tag','ext','09:00',[0,2,0,-2]],
 ['zufahrt','ext','09:10',[-2,0,2,0]],
 ['terrasse-essen','terr','09:20',[2,0,-2,0]],
 ['wohnen-tag','liv','09:40',[-2,1,2,-1]],
 ['essen','liv','10:00',[2,0,-1,0]],
 ['kueche','liv','10:15',[0,1,0,-1]],
 ['pool-tag','pool','12:30',[2,1,-2,0]],
 ['pool-deck','pool','13:15',[-2,0,2,0]],
 ['suite1','s1','14:30',[2,0,-2,0]],
 ['suite2','s2','15:00',[-2,0,2,0]],
 ['suite3','s3','15:20',[0,1,0,-1]],
 ['bad1','bath','15:40',[1,0,-1,0]],
 ['bad2','bath','15:50',[-1,0,1,0]],
 ['gym','gym','16:30',[2,0,-2,0]],
 ['lounge','lounge','17:15',[-2,1,2,-1]],
 ['pool-nacht','pool','18:40',[1,0,-1,0]],
 ['aussen-nacht','ext','21:00',[0,2,0,-1]]];
const N=STOPS.length;
const tour=$('#tour');tour.style.height=(isMobile?N*80:N*90)+100+'vh';
const shotsEl=$('#shots');const shots=STOPS.map(([img],i)=>{const d=document.createElement('div');d.className='shot';d.innerHTML=`<img src="img/${img}.webp" alt="" ${i<3?'':'loading="eager"'} decoding="async">`;shotsEl.appendChild(d);return d});
shots[0].style.opacity=1;
const zc={ext:[60,7],terr:[17,26],liv:[59,26],pool:[102,26],s1:[16,51],s2:[46,51],s3:[75,51],bath:[104,51],gym:[22,73],lounge:[81,73]};
const rail=$('#rail');const railB=STOPS.map((s,i)=>{const b=document.createElement('button');b.innerHTML=`<span></span><i></i>`;b.onclick=()=>jump(i);rail.appendChild(b);return b});
function stopY(i){const total=tour.offsetHeight-innerHeight;return tour.offsetTop+total*((i+.2)/N)}
function jump(i){goTo(stopY(i))}
$('#skip').onclick=()=>goTo($('#chapter'));
const secP=el=>{const r=el.getBoundingClientRect();return clamp(-r.top/(r.height-innerHeight))};
let cur=-1,TP=0;
function setCap(i,force){if(i===cur&&!force)return;cur=i;const c=$('#tcap');const s=T[lang].stops[i]||T.de.stops[i];
 c.classList.remove('on');
 setTimeout(()=>{ $('#tNum').textContent=String(i+1).padStart(2,'0');$('#tRoom').textContent=s[0];$('#tH1').textContent=s[1];$('#tH2').textContent=s[2];$('#tP').textContent=s[3];
  c.classList.toggle('end',i===N-1);$('#tC1').textContent=T[lang].tourCta[0];$('#tC2').textContent=T[lang].tourCta[1];void c.offsetWidth;c.classList.add('on')},force?0:180);
 $('#hStop').textContent=String(i+1).padStart(2,'0')+' / '+N;$('#hRoom').textContent=s[0];$('#hTime').textContent=STOPS[i][2];
 const z=STOPS[i][1];document.querySelectorAll('.tplan .z').forEach(r=>r.classList.toggle('on',r.dataset.z===z));
 const [x,y]=zc[z];$('#dot').setAttribute('cx',x);$('#dot').setAttribute('cy',y);
 railB.forEach((b,k)=>{b.classList.toggle('on',k===i);b.classList.toggle('done',k<i)});
}
function tourUpdate(p){
 const f=p*N;const i=Math.min(N-1,Math.floor(f));
 for(let k=0;k<N;k++){const s=shots[k];const l=f-k; // local
  if(l<-0.45||l>1.25){if(s.style.opacity!=='0')s.style.opacity=0;continue}
  const pan=STOPS[k][3];
  let op=1,sc,blur=0,tx,ty;
  const hold=clamp(l/.8);
  tx=lerp(pan[0],pan[2],hold);ty=lerp(pan[1],pan[3],hold);
  if(l<0){const e=ss(-.45,0,l);op=e;sc=lerp(1.28,1.1,e);blur=(1-e)*8}
  else if(l<.8){sc=lerp(1.1,1.03,ss(0,.8,l))}
  else{const e=ss(.8,1.25,l);sc=lerp(1.03,1.75,e);op=1-ss(.85,1.2,l);blur=e*10}
  if(k===0&&l<0){op=1;sc=1.1;blur=0}
  if(k===N-1&&l>.8){sc=1.03+(l-.8)*.1;op=1;blur=0}
  s.style.opacity=op;s.style.transform=`translate(${tx}%,${ty}%) scale(${sc})`;s.style.filter=blur>.2?`blur(${blur}px) brightness(${1+blur*.03})`:'none';s.style.zIndex=l<0?2:1}
 const fl=f-Math.floor(f);$('#flash').style.opacity=i<N-1?Math.sin(clamp((fl-.75)/.5)*Math.PI)*.55:0;
 setCap(i);
 $('#tbar').style.width=(p*100)+'%';
 $('#hint').style.opacity=p>.01?0:1;$('#skip').style.opacity=p>.97?0:1;
}

/* other scroll fx */
const chPh=$('#chPh'),chImg=chPh.querySelector('img'),track=$('#track'),ring=$('#ring'),statsBg=$('#statsBg'),nav=$('#nav');
const radius=isMobile?300:430;const dots=[];
function scrollFx(){
  nav.classList.toggle('solid',scrollY>tour.offsetHeight-innerHeight);
  const c=secP($('#chapter'));const e=ss(0,.75,c);
  chPh.style.clipPath=`inset(${lerp(18,0,e)}% ${lerp(isMobile?8:22,0,e)}% ${lerp(18,0,e)}% ${lerp(isMobile?8:22,0,e)}% round ${lerp(24,0,e)}px)`;
  chImg.style.transform=`scale(${lerp(1.25,1,e)})`;
  const g=secP($('#light'));const max=track.scrollWidth-innerWidth+innerWidth*.06;track.style.transform=`translateX(${-g*max}px)`;
  track.querySelectorAll('img').forEach((im,i)=>{im.style.transform=`translateX(${(-g*12+i*3)}%)`});
  const w=secP($('#ways'));const rot=-w*300;ring.style.transform=`translateZ(${-radius}px) rotateY(${rot}deg)`;
  const idx=((Math.round(-rot/60)%6)+6)%6;dots.forEach((d,i)=>d.classList.toggle('on',i===idx));
  const sr=$('#stats').getBoundingClientRect();statsBg.style.transform=`translateY(${(sr.top/innerHeight)*-60}px)`;
}
let tourVis=true;new IntersectionObserver(e=>tourVis=e[0].isIntersecting).observe(tour);
function frame(ts){if(lenis)lenis.raf(ts);
  if(tourVis){const pt=secP(tour);TP+=(pt-TP)*.12;if(Math.abs(pt-TP)<1e-4)TP=pt;tourUpdate(TP)}
  scrollFx();requestAnimationFrame(frame)}

/* ===== reveal & counters ===== */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add('in');e.target.querySelectorAll?.('[data-n]').forEach(countUp);io.unobserve(e.target)}),{threshold:.15});
document.querySelectorAll('.rv,#bigword').forEach(el=>io.observe(el));
function countUp(el){if(el.dataset.done)return;el.dataset.done=1;const n=+el.dataset.n,s=el.dataset.s||'',pr=el.dataset.p||'',d=+(el.dataset.d||0);const t0=performance.now();
 (function f(tt){const k=ss(0,1,(tt-t0)/1800);el.textContent=pr+(n*k).toFixed(d).replace('.',lang==='de'||lang==='it'?',':'.')+s;if(k<1)requestAnimationFrame(f)})(t0)}
'SAMUI'.split('').forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch;s.style.transitionDelay=(i*.07)+'s';$('#bigword').appendChild(s)});

/* cursor */
const cu=$('#cursor');let cx=0,cy=0,tx=0,ty=0;addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY});
(function cl(){cx+=(tx-cx)*.2;cy+=(ty-cy)*.2;cu.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;requestAnimationFrame(cl)})();
document.addEventListener('mouseover',e=>cu.classList.toggle('big',!!e.target.closest('a,button,.card,figure')));

/* ===== dynamic content ===== */
const wayImg=['pool-tag','suite2','pool-deck','wohnen-tag','gym','pool-abend'];
const amIc=['🏊','🌊','🏖️','📶','💻','🚗','❄️','🍳','🛏️','🛁','🏋️','🐾'];
const barV=[5,5,5,5,4.9,5];const tagC=[45,36,14,14,11,9,5,5];
const NIGHT=289;
const extras=[{id:'transfer',ic:'🚐',p:35},{id:'roller',ic:'🛵',p:12},{id:'breakfast',ic:'🥭',p:18},{id:'massage',ic:'💆',p:28},{id:'boat',ic:'⛵',p:85},{id:'late',ic:'🌅',p:60}];
const exT=id=>{const i=extras.findIndex(x=>x.id===id);return T[lang].extras[i]};
const eur=n=>n.toLocaleString(LOCALE[lang],{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2})+' €';
const fmtD=s=>new Date(s).toLocaleDateString(LOCALE[lang],{day:'2-digit',month:'short'});

function renderDynamic(){
 // ways
 ring.innerHTML='';$('#dots').innerHTML='';dots.length=0;
 T[lang].ways.forEach(([ti,d,f],i)=>{const c=document.createElement('div');c.className='card';c.style.transform=`rotateY(${i*60}deg) translateZ(${radius}px)`;
  c.innerHTML=`<img src="img/${wayImg[i]}.webp" alt="" loading="lazy"><span class="from">${f}</span><div class="c"><div class="n">0${i+1} / 06</div><h3>${ti}</h3><p>${d}</p></div>`;ring.appendChild(c);
  const s=document.createElement('span');$('#dots').appendChild(s);dots.push(s)});
 // amenities
 const ag=$('#amenGrid');const wasIn=ag.dataset.in;ag.innerHTML='';
 T[lang].amen.forEach((a,i)=>{const d=document.createElement('div');d.className='am rv'+(wasIn?' in':'');d.innerHTML=`<i>${amIc[i]}</i><span>${a}</span>`;ag.appendChild(d);if(!wasIn)io.observe(d)});ag.dataset.in=1;
 // bars & tags
 $('#bars').innerHTML='';T[lang].bars.forEach((n,i)=>{const d=document.createElement('div');d.className='bar';const v=barV[i];
  d.innerHTML=`<div><span>${n}</span><span>${lang==='de'||lang==='it'?v.toFixed(1).replace('.',','):v.toFixed(1)}</span></div><u><i style="--v:${v/5}"></i></u>`;$('#bars').appendChild(d)});
 $('#tags').innerHTML='';T[lang].tags.forEach((n,i)=>{const s=document.createElement('span');s.innerHTML=`${n}<b>${tagC[i]}×</b>`;$('#tags').appendChild(s)});
 // extras
 const ex=$('#extras');const exIn=ex.dataset.in;ex.innerHTML='';
 extras.forEach((x,i)=>{const [n,d,u]=T[lang].extras[i];const el=document.createElement('div');el.className='ex rv'+(exIn?' in':'');
  el.innerHTML=`<div class="ic">${x.ic}</div><div><h4>${n}</h4><p>${d}</p></div><div class="r"><b>${eur(x.p)} <small style="color:var(--mut);font-weight:400">/ ${u}</small></b><button class="add">${t('add')}</button></div>`;
  const b=el.querySelector('.add');b.onclick=()=>{addEx(x.id);b.classList.add('ok');b.textContent=t('added');setTimeout(()=>{b.classList.remove('ok');b.textContent=t('add')},1300)};
  ex.appendChild(el);if(!exIn)io.observe(el)});ex.dataset.in=1;
 // faq
 $('#faqs').innerHTML='';T[lang].faq.forEach(([q,a],i)=>{const d=document.createElement('div');d.className='qa'+(i===0?' open':'');
  d.innerHTML=`<button>${q}<i>+</i></button><div class="a"><div><p>${a}</p></div></div>`;d.querySelector('button').onclick=()=>d.classList.toggle('open');$('#faqs').appendChild(d)});
 // rules, map, plan label
 $('#rules').innerHTML=T[lang].rules.map(([k,v])=>`<li><span>${k}</span><span>${v}</span></li>`).join('');
 document.querySelectorAll('[data-m]').forEach(e=>e.textContent=T[lang].map[+e.dataset.m]);
 railB.forEach((b,i)=>b.querySelector('span').textContent=T[lang].stops[i][0]);
 calc();render();
}
function setLang(l){if(!T[l])return;lang=l;try{localStorage.setItem('hilltop-lang',l)}catch(e){}
 document.documentElement.lang=l;$('#langCode').textContent=l.toUpperCase();
 document.querySelectorAll('#langList [data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
 document.querySelectorAll('[data-t]').forEach(e=>{const v=t(e.dataset.t);if(v!=null)e.innerHTML=v});
 document.querySelectorAll('[data-n]').forEach(e=>{if(e.dataset.done){const n=+e.dataset.n,d=+(e.dataset.d||0);e.textContent=(e.dataset.p||'')+n.toFixed(d).replace('.',l==='de'||l==='it'?',':'.')+(e.dataset.s||'')}});
 renderDynamic();if(cur>=0)setCap(cur,true);
 if($('#co').classList.contains('on')&&step<2)coRender();
 document.body.classList.remove('langfade');void document.body.offsetWidth;document.body.classList.add('langfade');
}

/* ===== booking & cart ===== */
const nights=()=>{const a=new Date($('#dIn').value),b=new Date($('#dOut').value);return Math.round((b-a)/864e5)};
function calc(){const n=nights();if(!(n>0)){$('#dErr').textContent=t('bk.err');$('#nLbl').textContent='–';$('#nSum').textContent='–';$('#bTot').textContent='–';return}
 $('#dErr').textContent='';$('#nLbl').textContent=`${eur(NIGHT)} × ${n} ${n>1?t('bk.nights'):t('bk.night')}`;$('#nSum').textContent=eur(NIGHT*n);$('#bTot').textContent=eur(NIGHT*n)}
['#dIn','#dOut','#guests'].forEach(s=>$(s).addEventListener('change',calc));

let cart={stay:null,ex:{}};try{const c=JSON.parse(localStorage.getItem('hilltop-cart')||'null');if(c&&c.ex)cart=c}catch(e){}
const save=()=>{try{localStorage.setItem('hilltop-cart',JSON.stringify(cart))}catch(e){}};
$('#addStay').onclick=()=>{const n=nights();if(!(n>0)){calc();return}cart.stay={in:$('#dIn').value,out:$('#dOut').value,n,g:+$('#guests').value,p:NIGHT*n};save();render();bump();toast(t('t.stay'));openDrawer()};
function addEx(id){cart.ex[id]=(cart.ex[id]||0)+1;save();render();bump();toast(t('t.ex'))}
function bump(){const cb=$('#cartbtn');cb.classList.remove('bump');void cb.offsetWidth;cb.classList.add('bump')}
function totals(){const st=cart.stay?cart.stay.p:0;let ex=0;for(const id in cart.ex)ex+=extras.find(x=>x.id===id).p*cart.ex[id];return{st,ex,tot:st+ex}}
const gTxt=g=>`${g} ${g>1?t('c.guests'):t('c.guest')}`;
function render(){
 const cnt=(cart.stay?1:0)+Object.values(cart.ex).reduce((a,b)=>a+b,0);const cc=$('#ccount');cc.textContent=cnt;cc.classList.toggle('on',cnt>0);
 const L=$('#lines');L.innerHTML='';
 if(!cnt)L.innerHTML=`<div class="empty">${t('c.empty')}</div>`;
 if(cart.stay){const r=document.createElement('div');r.className='ln';const s=cart.stay;
  r.innerHTML=`<div><h5>${t('c.villa')} · ${s.n} ${s.n>1?t('bk.nights'):t('bk.night')}</h5><p style="color:var(--mut);font-size:13px;margin-top:4px">${fmtD(s.in)} – ${fmtD(s.out)} · ${gTxt(s.g)}</p><div class="q"><button class="rm" data-r style="margin:0">${t('c.rm')}</button></div></div><b>${eur(s.p)}</b>`;
  r.querySelector('[data-r]').onclick=()=>{cart.stay=null;save();render()};L.appendChild(r)}
 for(const id in cart.ex){const x=extras.find(e=>e.id===id);const [n,,u]=exT(id);const r=document.createElement('div');r.className='ln';
  r.innerHTML=`<div><h5>${x.ic} ${n}</h5><div class="q"><button data-d>−</button><span>${cart.ex[id]}</span><button data-i>+</button><span style="font-size:12px;color:var(--mut);min-width:0">× ${u}</span><button class="rm" data-r>${t('c.rm')}</button></div></div><b>${eur(x.p*cart.ex[id])}</b>`;
  r.querySelector('[data-d]').onclick=()=>{cart.ex[id]--;if(cart.ex[id]<=0)delete cart.ex[id];save();render()};
  r.querySelector('[data-i]').onclick=()=>{cart.ex[id]++;save();render()};
  r.querySelector('[data-r]').onclick=()=>{delete cart.ex[id];save();render()};L.appendChild(r)}
 const tt=totals();$('#sStay').textContent=cart.stay?eur(tt.st):'–';$('#sEx').textContent=eur(tt.ex);$('#sTot').textContent=eur(tt.tot);
 $('#toCheckout').disabled=!cart.stay;$('#toCheckout').textContent=cart.stay?t('c.go'):t('c.go0');
}
function openDrawer(){$('#drawer').classList.add('on');$('#overlay').classList.add('on');lenis?.stop()}
function closeAll(){$('#drawer').classList.remove('on');$('#overlay').classList.remove('on');$('#co').classList.remove('on');lenis?.start()}
$('#cartbtn').onclick=openDrawer;$('#overlay').onclick=closeAll;document.querySelector('[data-close]').onclick=closeAll;addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});

const panel=$('#coPanel');let step=0,cust={};
const stepper=n=>`<div class="stepper">${[0,1,2].map(i=>`<span class="${i<=n?'on':''}"></span>`).join('')}</div>`;
function coRender(){const tt=totals();
 if(step===0){panel.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-weight:500;font-size:24px">${t('co.d')}</h3><button class="x" id="coX">×</button></div>${stepper(0)}
  <form id="f1"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label class="l">${t('co.fn')}</label><input class="inp" name="fn" required value="${cust.fn||''}"></div><div><label class="l">${t('co.ln')}</label><input class="inp" name="ln" required value="${cust.ln||''}"></div></div>
  <label class="l">${t('co.em')}</label><input class="inp" type="email" name="em" required value="${cust.em||''}">
  <label class="l">${t('co.ph')}</label><input class="inp" name="ph" value="${cust.ph||''}" placeholder="${t('co.opt')}">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label class="l">${t('co.fl')}</label><input class="inp" name="fl" value="${cust.fl||''}" placeholder="PG 171"></div><div><label class="l">${t('co.ar')}</label><input class="inp" name="ar" type="time" value="${cust.ar||'15:00'}"></div></div>
  <label class="l">${t('co.ms')}</label><textarea class="inp" name="ms" placeholder="${t('co.msp')}">${cust.ms||''}</textarea>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap"><span style="color:var(--mut)">${t('c.tot')} ${eur(tt.tot)}</span><button class="pill acc">${t('co.next')}</button></div></form>`;
  $('#f1').onsubmit=e=>{e.preventDefault();cust=Object.fromEntries(new FormData(e.target));step=1;coRender()}}
 if(step===1){const s=cart.stay;panel.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-weight:500;font-size:24px">${t('co.pay')}</h3><button class="x" id="coX">×</button></div>${stepper(1)}
  <form id="f2"><div class="pay"><label><input type="radio" name="pm" value="card" checked> ${t('co.card')}</label><label><input type="radio" name="pm" value="paypal"> PayPal</label><label><input type="radio" name="pm" value="bank"> ${t('co.bank')}</label></div>
  <div class="cardf on" id="cardf"><input class="inp" placeholder="${t('co.cn')}" id="cn"><input class="inp" placeholder="MM/YY"><input class="inp" placeholder="CVC"></div>
  <div style="margin-top:22px;border-top:1px solid var(--line);padding-top:14px"><div class="sum"><span>${t('c.villa')} · ${fmtD(s.in)}–${fmtD(s.out)} · ${s.n} ${t('bk.nights')}</span><span>${eur(s.p)}</span></div>
  ${Object.keys(cart.ex).map(id=>{const x=extras.find(e=>e.id===id);return `<div class="sum"><span>${cart.ex[id]}× ${exT(id)[0]}</span><span>${eur(x.p*cart.ex[id])}</span></div>`}).join('')}
  <div class="sum t"><span>${t('c.tot')}</span><span>${eur(tt.tot)}</span></div></div>
  <label style="display:flex;gap:10px;font-size:13px;color:var(--mut);align-items:flex-start"><input type="checkbox" required style="margin-top:3px;accent-color:var(--acc)"> ${t('co.agree')}</label>
  <div class="err" id="err"></div>
  <div style="display:flex;justify-content:space-between;margin-top:12px;gap:10px"><button type="button" class="pill ghost" id="back">${t('co.back')}</button><button class="pill acc" id="pay">${t('co.buy')}</button></div></form>`;
  const cf=$('#cardf');panel.querySelectorAll('[name=pm]').forEach(r=>r.onchange=()=>cf.classList.toggle('on',r.value==='card'&&r.checked));
  $('#back').onclick=()=>{step=0;coRender()};
  $('#f2').onsubmit=e=>{e.preventDefault();const pm=new FormData(e.target).get('pm');
   if(pm==='card'&&$('#cn').value.replace(/\s/g,'').length<12){$('#err').textContent=t('co.cerr');return}
   const b=$('#pay');b.textContent=t('co.busy');b.disabled=true;cust.pm=pm==='card'?t('co.card'):pm==='bank'?t('co.bank'):'PayPal';
   setTimeout(()=>{cust.code='HS-'+Math.random().toString(36).slice(2,8).toUpperCase();cust.sum=tt.tot;cust.stay={...cart.stay};cust.lines=Object.keys(cart.ex).map(id=>cart.ex[id]+'× '+exT(id)[0]);
    cart={stay:null,ex:{}};save();render();step=2;coRender()},1300)}}
 if(step===2){const s=cust.stay;panel.innerHTML=`${stepper(2)}<div class="done"><svg viewBox="0 0 100 100" fill="none" stroke="#46d8e4" stroke-width="3"><circle cx="50" cy="50" r="45"/><path d="M30 52l13 13 27-29"/></svg>
  <h3 style="font-weight:500;font-size:28px">${t('co.hi')}, ${cust.fn}! 🌺</h3><p style="color:var(--mut);margin-top:10px;line-height:1.6">${t('co.code')} <b style="color:var(--txt)">${cust.code}</b> ${t('co.ok')}<br>${fmtD(s.in)} – ${fmtD(s.out)} · ${s.n} ${t('bk.nights')} · ${gTxt(s.g)}<br>${t('co.to')} ${cust.em} · ${cust.pm}</p>
  <div style="text-align:left;margin:22px auto 0;max-width:380px;border-top:1px solid var(--line);padding-top:12px"><div class="sum"><span>${t('c.villa')}</span><span>${eur(s.p)}</span></div>${cust.lines.map(l=>`<div class="sum"><span>${l}</span></div>`).join('')}<div class="sum t"><span>${t('co.sum')}</span><span>${eur(cust.sum)}</span></div></div>
  <p style="color:var(--mut);font-size:13px">${t('co.ci')}</p><button class="pill acc" id="fin" style="margin-top:20px">${t('co.fin')}</button></div>`;$('#fin').onclick=()=>{step=0;closeAll()}}
 const x=$('#coX');if(x)x.onclick=closeAll}
$('#toCheckout').onclick=()=>{$('#drawer').classList.remove('on');step=0;coRender();$('#co').classList.add('on');$('#overlay').classList.add('on')};

let tT;window.toast=m=>{const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),2200)};

setLang(lang);
requestAnimationFrame(frame);
// preload all tour images
STOPS.forEach(([img])=>{const i=new Image();i.src=`img/${img}.webp`});
</script>
</body>
</html>
