<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vorschau</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
/*
  Personalisierbare Demo-Vorlage.
  Link-Parameter: n=bau|gastro|hotel|beauty  name=  ort=  tel=  str=  farbe=hex (ohne #)  von=Absendername
  Beispiel: ?n=gastro&name=Emils%20Altes%20Brauhaus&ort=Bad%20Hersfeld&tel=06621%20000000
*/
:root{--bg:#f6f3ee;--fg:#191714;--muted:#6b645c;--line:rgba(25,23,20,.12);--card:#fff;--accent:#8c2f39;--accent-ink:#fff;--dark:#191714;--dark-fg:#f6f3ee;
--display:'Fraunces',Georgia,serif;--body:'Inter',system-ui,-apple-system,sans-serif;--dw:600;--dcase:none;--dls:-.01em}
body.bau{--bg:#f2f1ee;--fg:#16181a;--muted:#5f646a;--accent:#ff6a1a;--accent-ink:#16181a;--dark:#16181a;--dark-fg:#f2f1ee;--display:'Archivo',system-ui,sans-serif;--dw:900;--dcase:uppercase;--dls:-.02em}
body.gastro{--bg:#f7f2ea;--fg:#231a16;--muted:#73655b;--accent:#8c2f39;--accent-ink:#fff;--dark:#231a16;--dark-fg:#f7f2ea;--display:'Fraunces',Georgia,serif;--dw:600}
body.hotel{--bg:#f4f1ec;--fg:#18202b;--muted:#636b75;--accent:#a8834f;--accent-ink:#fff;--dark:#18202b;--dark-fg:#f4f1ec;--display:'Cormorant Garamond',Georgia,serif;--dw:500;--dls:0}
body.beauty{--bg:#f8f3f1;--fg:#1c1718;--muted:#6f6467;--accent:#b9776a;--accent-ink:#fff;--dark:#1c1718;--dark-fg:#f8f3f1;--display:'Playfair Display',Georgia,serif;--dw:500;--dls:0}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.w{width:min(1160px,100% - 32px);margin:0 auto}
h1,h2,h3{overflow-wrap:break-word;hyphens:auto;font-family:var(--display);font-weight:var(--dw);text-transform:var(--dcase);letter-spacing:var(--dls);line-height:1.02;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,filter .2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.out{border:1.5px solid currentColor;background:transparent}
body.bau .btn{border-radius:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* preview banner */
.pv{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--dark);color:var(--dark-fg);border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;font-size:12.5px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:calc(100% - 24px)}
.pv b{color:var(--accent)}
body.bau .pv b,body.hotel .pv b{color:var(--accent)}
.pv span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv button{background:rgba(255,255,255,.14);border:0;border-radius:999px;width:28px;height:28px;flex:none;cursor:pointer;color:inherit}

/* intro */
#intro{position:fixed;inset:0;z-index:80;background:var(--dark);display:grid;place-items:center;transition:clip-path 1s cubic-bezier(.7,0,.2,1)}
#intro.go{clip-path:inset(0 0 100% 0)}
#intro svg{width:120px;height:120px}
#intro svg *{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.2s ease forwards}
#intro p{position:absolute;bottom:18%;left:0;right:0;text-align:center;color:var(--dark-fg);font-family:var(--display);font-size:clamp(22px,4vw,34px);text-transform:var(--dcase);opacity:0;animation:fadein .8s .5s forwards;padding:0 16px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}

/* nav */
nav{position:fixed;inset:0 0 auto;z-index:50;padding:14px 0;transition:background .3s,padding .3s;color:#fff}
nav.solid{background:var(--bg);color:var(--fg);box-shadow:0 1px 0 var(--line);padding:10px 0}
nav .w{display:flex;justify-content:space-between;align-items:center;gap:14px}
.logo{font-family:var(--display);font-weight:var(--dw);text-transform:var(--dcase);font-size:20px;text-decoration:none;line-height:1.1;max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav .links{display:flex;gap:22px;font-size:14px}
nav .links a{text-decoration:none;opacity:.85}
nav .btn{min-height:40px;padding:0 16px;font-size:14px}
@media (max-width:820px){nav .links{display:none}}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.hero .bg{position:absolute;inset:0}
.hero .bg img{width:100%;height:100%;object-fit:cover;animation:kb 18s ease-out forwards;transform-origin:60% 40%}
@keyframes kb{from{transform:scale(1.15)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.1) 35%,rgba(0,0,0,.72))}
.hero .w{position:relative;z-index:2;padding:140px 0 90px}
.hero .eyebrow{color:#fff;opacity:.9}
.hero h1{font-size:clamp(34px,8.6vw,116px);margin-top:14px;max-width:14ch;overflow-wrap:break-word;hyphens:auto}
.hero p{font-size:clamp(16px,1.7vw,20px);max-width:560px;margin-top:20px;opacity:.92}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.hero .chips span{font-size:12.5px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:999px}
.hero .w>*{opacity:0;transform:translateY(24px);transition:opacity .9s,transform .9s}
.loaded .hero .w>*{opacity:1;transform:none}
.loaded .hero .w>*:nth-child(2){transition-delay:.1s}.loaded .hero .w>*:nth-child(3){transition-delay:.2s}.loaded .hero .w>*:nth-child(4){transition-delay:.3s}.loaded .hero .w>*:nth-child(5){transition-delay:.4s}

section{padding:96px 0}
.h2{font-size:clamp(34px,5.2vw,64px);margin-top:12px}
.lead{color:var(--muted);max-width:600px;margin-top:16px;font-size:17px}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}

/* services / cards */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:44px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;transition:transform .3s,box-shadow .3s}
body.bau .svc{border-radius:4px}
.svc:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.08)}
.svc .ic{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.svc .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.svc h3{font-size:22px;margin-top:16px}
body.bau .svc h3{font-size:18px}
.svc p{color:var(--muted);font-size:14.5px;margin-top:6px}
.svc .pr{margin-top:12px;font-weight:600}
@media (max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid3{grid-template-columns:1fr}}

/* split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,70px);align-items:center}
.split .ph{border-radius:22px;overflow:hidden;aspect-ratio:4/4.4}
body.bau .split .ph{border-radius:4px}
.split .ph img{width:100%;height:115%;object-fit:cover}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.facts b{display:block;font-family:var(--display);font-size:38px;font-weight:var(--dw);color:var(--accent);line-height:1}
.facts span{font-size:13px;color:var(--muted)}
@media (max-width:820px){.split{grid-template-columns:1fr}}

/* before after */
.ba{position:relative;margin-top:44px;border-radius:18px;overflow:hidden;aspect-ratio:16/8;user-select:none;touch-action:pan-y;cursor:ew-resize}
body.bau .ba{border-radius:4px}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ba .after{clip-path:inset(0 0 0 50%)}
.ba .handle{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;transform:translateX(-50%)}
.ba .handle::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px;font-weight:700}
.ba .lab{position:absolute;top:14px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;padding:5px 10px;border-radius:999px}
@media (max-width:600px){.ba{aspect-ratio:4/3.4}}

/* menu */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:34px}
.tabs button{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.menu{margin-top:18px;max-width:780px}
.menu li{list-style:none;display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px dashed var(--line)}
.menu li b{font-family:var(--display);font-size:20px;font-weight:var(--dw)}
.menu li span{display:block;color:var(--muted);font-size:14px}
.menu li em{font-style:normal;font-weight:600;white-space:nowrap}

/* gallery */
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:220px 220px;gap:12px;margin-top:44px}
.gal div{border-radius:16px;overflow:hidden}
body.bau .gal div{border-radius:4px}
.gal div:first-child{grid-row:1/3}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform 1s}
.gal div:hover img{transform:scale(1.06)}
@media (max-width:700px){.gal{grid-template-columns:1fr 1fr;grid-template-rows:180px 140px 140px}.gal div:first-child{grid-column:1/3;grid-row:auto}}

/* booking form */
.book{background:var(--dark);color:var(--dark-fg)}
.book .lead{color:rgba(255,255,255,.7)}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:34px;align-items:end}
.form label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:6px}
.form input,.form select,.form textarea{width:100%;min-width:0;height:50px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);padding:0 14px;color:var(--dark-fg)}
.form textarea{height:100px;padding:12px 14px}
.form select option{color:#000}
.form .full{grid-column:1/-1}
.form .btn{height:50px}
body.bau .form input,body.bau .form select,body.bau .form textarea{border-radius:4px}
@media (max-width:820px){.form{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slots button{border:1px solid rgba(255,255,255,.25);background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--dark-fg)}
.slots button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* reviews */
.revs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:40px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.rev .st{color:var(--accent);letter-spacing:2px}
.rev p{font-family:var(--display);font-size:19px;line-height:1.35;margin-top:10px;text-transform:none}
.rev small{display:block;color:var(--muted);margin-top:12px}
@media (max-width:820px){.revs{grid-template-columns:1fr}}

/* info */
.info{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,70px)}
.hours{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.hours dl{display:grid;grid-template-columns:1fr auto;gap:10px 18px;margin-top:12px}
.hours dt{color:var(--muted)}
.hours dd{font-weight:600;text-align:right}
.hours .now{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-top:4px}
.hours .now i{width:8px;height:8px;border-radius:50%;background:#2e9e5b}
.contact-big{font-family:var(--display);font-size:clamp(26px,3.4vw,40px);font-weight:var(--dw);margin-top:18px;line-height:1.2;text-transform:none}
@media (max-width:820px){.info{grid-template-columns:1fr}}

footer{background:var(--dark);color:var(--dark-fg);padding:50px 0 110px;font-size:13px}
footer .w{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer a{opacity:.75}
#toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-300%);visibility:hidden;z-index:90;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;transition:transform .4s cubic-bezier(.3,1.4,.5,1);max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translate(-50%,0);visibility:visible}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.hero .w>*{opacity:1;transform:none}#intro{display:none}}
</style>
</head>
<body class="gastro">
<div id="intro" aria-hidden="true"><svg viewBox="0 0 100 100" id="introIcon"></svg><p id="introName"></p></div>

<nav id="nav"><div class="w">
  <a class="logo" href="#top" data-t="name"></a>
  <div class="links" id="navLinks"></div>
  <a class="btn acc" href="#aktion" id="navCta"></a>
</div></nav>

<header class="hero" id="top">
  <div class="bg"><img id="heroImg" alt=""></div>
  <div class="w">
    <div class="eyebrow" id="heroEyebrow"></div>
    <h1 data-t="name"></h1>
    <p id="heroText"></p>
    <div class="cta"><a class="btn acc" href="#aktion" id="heroCta"></a><a class="btn out" id="heroCall"></a></div>
    <div class="chips" id="heroChips"></div>
  </div>
</header>

<main id="main"></main>

<footer><div class="w">
  <div>© <span id="yr"></span> <span data-t="name"></span> · <span data-t="ort"></span></div>
  <div><a href="#" id="impLink">Impressum</a> · <a href="#" id="dsLink">Datenschutz</a></div>
</div></footer>

<div class="pv" id="pv"><span>Vorschau für <b data-t="name"></b> · erstellt von <span id="von"></span></span><button id="pvClose" aria-label="Hinweis ausblenden">✕</button></div>
<div id="toast" role="status"></div>

<script>
const P=new URLSearchParams(location.search);
const clean=(v,max)=>(v||'').replace(/[<>]/g,'').trim().slice(0,max||80);
const N=['bau','gastro','hotel','beauty'].includes(P.get('n'))?P.get('n'):'gastro';
const D={name:clean(P.get('name'))||({bau:'Muster Bau GmbH',gastro:'Gasthaus zur Linde',hotel:'Hotel am Markt',beauty:'Studio Schnitt'}[N]),
  ort:clean(P.get('ort'),40)||'Bad Hersfeld',tel:clean(P.get('tel'),30)||'06621 000000',str:clean(P.get('str'),60)||'Musterstraße 1',
  von:clean(P.get('von'),40)||'Webwerk Osthessen'};
const farbe=(P.get('farbe')||'').replace(/[^0-9a-fA-F]/g,'');
document.body.className=N;
if(farbe.length===6||farbe.length===3)document.body.style.setProperty('--accent','#'+farbe);
document.title=D.name+' · '+D.ort;
document.querySelectorAll('[data-t]').forEach(el=>el.textContent=D[el.dataset.t]);
document.getElementById('von').textContent=D.von;
document.getElementById('yr').textContent=new Date().getFullYear();

const ICON={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',roof:'<path d="M2 12L12 4l10 8M5 10v10h14V10"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',drop:'<path d="M12 3s7 7 7 12a7 7 0 0 1-14 0c0-5 7-12 7-12z"/>',
 brush:'<path d="M4 20c3 0 5-2 5-5l9-9a2 2 0 0 0-3-3l-9 9c-3 0-5 2-5 5"/>',tree:'<path d="M12 22v-6M7 16h10l-5-12z"/>',plate:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/>',
 bed:'<path d="M3 18V8M3 14h18v4M21 18v-6a2 2 0 0 0-2-2h-8v4"/><circle cx="7" cy="11" r="2"/>',wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/>',
 car:'<path d="M5 16h14M3 16v-4l2-5h14l2 5v4M7 19v-3M17 19v-3"/>',cup:'<path d="M4 8h13v5a6 6 0 0 1-12 0zM17 9h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2"/>',scissor:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8L20 18M8.5 16L20 6"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',leaf:'<path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15M5 19l7-7"/>',heart:'<path d="M12 20s-8-5-8-11a4 4 0 0 1 8-2 4 4 0 0 1 8 2c0 6-8 11-8 11z"/>',key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${ICON[n]}</svg>`;
const INTRO={bau:'<path d="M15 80h70M25 80V45l25-20 25 20v35M40 80V58h20v22"/>',gastro:'<circle cx="50" cy="55" r="26"/><circle cx="50" cy="55" r="14"/><path d="M14 30v50M10 30v12a4 4 0 0 0 8 0V30M86 30c-6 4-6 18 0 22v28"/>',
 hotel:'<path d="M20 80V30h60v50M20 80h60M35 45h10M55 45h10M35 60h10M55 60h10M45 80V68h10v12"/>',beauty:'<circle cx="32" cy="32" r="12"/><circle cx="32" cy="72" r="12"/><path d="M41 40l45 40M41 64l45-40"/>'};

const C={
 bau:{eyebrow:`Bau & Handwerk in ${D.ort}`,text:`Ihr Partner für Neubau, Sanierung und Ausbau in ${D.ort} und Umgebung. Termintreu, sauber, mit festem Ansprechpartner.`,
  cta:'Projekt anfragen',navCta:'Anfragen',hero:'bau1',chips:['Meisterbetrieb','Festpreis-Angebot','Region '+D.ort],
  links:[['Leistungen','#leistungen'],['Referenzen','#referenzen'],['Ablauf','#ablauf'],['Kontakt','#kontakt']]},
 gastro:{eyebrow:`Restaurant in ${D.ort}`,text:`Ehrliche Küche, frische Zutaten aus der Region und ein Platz, an dem man gern länger bleibt. Wir freuen uns auf Sie.`,
  cta:'Tisch reservieren',navCta:'Reservieren',hero:'gastro1',chips:['Regionale Küche','Mittagstisch','Feiern & Gruppen'],
  links:[['Speisekarte','#karte'],['Galerie','#galerie'],['Reservieren','#aktion'],['Anfahrt','#kontakt']]},
 hotel:{eyebrow:`Hotel in ${D.ort}`,text:`Ruhig schlafen, gut frühstücken, alles Wichtige in der Nähe. Direkt bei uns buchen – zum besten Preis, ohne Portalgebühr.`,
  cta:'Direkt anfragen',navCta:'Buchen',hero:'hotel1',chips:['Bester Preis bei Direktbuchung','Frühstück inklusive','Kostenloses WLAN'],
  links:[['Zimmer','#zimmer'],['Ausstattung','#ausstattung'],['Umgebung','#umgebung'],['Kontakt','#kontakt']]},
 beauty:{eyebrow:`Friseur & Beauty in ${D.ort}`,text:`Schnitt, Farbe, Pflege – mit Zeit für Sie. Termin in 30 Sekunden online buchen.`,
  cta:'Termin buchen',navCta:'Termin',hero:'beauty1',chips:['Online-Termin','Damen · Herren · Bart','Hochwertige Produkte'],
  links:[['Leistungen','#preise'],['Galerie','#galerie'],['Termin','#aktion'],['Kontakt','#kontakt']]}
}[N];

const telHref='tel:'+D.tel.replace(/[^0-9+]/g,'');
document.getElementById('heroImg').src='img/'+C.hero+'.webp';
document.getElementById('heroEyebrow').textContent=C.eyebrow;
document.getElementById('heroText').textContent=C.text;
document.getElementById('heroCta').textContent=C.cta;

if(MENU[N]){
  const tabs=document.getElementById('mtabs'),list=document.getElementById('menu');const keys=Object.keys(MENU[N]);
  const show=k=>{tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));list.innerHTML=MENU[N][k].map(i=>`<li><div><b>${i[0]}</b>${i[1]?`<span>${i[1]}</span>`:''}</div><em>${i[2]}</em></li>`).join('');};
  tabs.innerHTML=keys.map(k=>`<button type="button" role="tab" data-k="${k}">${k}</button>`).join('');

/* beauty slots */
if(N==='beauty'){
  const days=document.getElementById('days'),times=document.getElementById('times');const dn=['So','Mo','Di','Mi','Do','Fr','Sa'];let d=new Date(),out=[];
  while(out.length<6){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==1)out.push(new Date(d));}
  days.innerHTML=out.map((x,i)=>`<button type="button" class="${i?'':'on'}">${dn[x.getDay()]} ${x.getDate()}.${x.getMonth()+1}.</button>`).join('');
  times.innerHTML=['9:00','10:30','11:00','13:30','15:00','16:30','17:00'].map((t,i)=>`<button type="button" class="${i===2?'on':''}">${t}</button>`).join('');
  [days,times].forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');}));
}
/* before/after */
const ba=document.getElementById('ba');
if(ba){const set=x=>{const r=ba.getBoundingClientRect();const p=Math.max(0,Math.min(100,(x-r.left)/r.width*100));ba.querySelector('.after').style.clipPath=`inset(0 0 0 ${p}%)`;ba.querySelector('.handle').style.left=p+'%';};
 let drag=false;ba.addEventListener('pointerdown',e=>{drag=true;set(e.clientX);});addEventListener('pointermove',e=>{if(drag)set(e.clientX);});addEventListener('pointerup',()=>drag=false);
 let t=0;const auto=setInterval(()=>{t+=.04;set(ba.getBoundingClientRect().left+ba.offsetWidth*(.5+Math.sin(t)*.3));if(t>6.28){clearInterval(auto);}},30);ba.addEventListener('pointerdown',()=>clearInterval(auto));}
/* forms */
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3200);};

/* reveal, counters, nav, parallax */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;el.classList.add('in');io.unobserve(el);
  el.querySelectorAll('[data-c]').forEach(b=>{const to=+b.dataset.c;let s=null;const step=ts=>{s=s||ts;const p=Math.min(1,(ts-s)/1400);b.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString('de-DE');if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);});}),{threshold:.12});
document.querySelectorAll('.rv').forEach((el,i)=>{el.style.transitionDelay=(i%3)*90+'ms';io.observe(el);});
const nav=document.getElementById('nav');
const onScroll=()=>{nav.classList.toggle('solid',scrollY>60);document.querySelectorAll('[data-par]').forEach(img=>{const r=img.parentElement.getBoundingClientRect();img.style.transform=`translateY(${(r.top/innerHeight-.5)*-40}px)`;});};
addEventListener('scroll',onScroll,{passive:true});onScroll();
/* intro */
const intro=document.getElementById('intro');
setTimeout(()=>{intro.classList.add('go');document.body.classList.add('loaded');setTimeout(()=>intro.remove(),1100);},1500);
